name: Actualizar Estadísticas SVG

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta todos los días a la medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/action-setup@v4 # O usa setup-python
        with:
          python-version: '3.10'

      - name: Instalar dependencias (si hace falta)
        run: pip install --upgrade pip

      - name: Ejecutar script de estadísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_stats.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git commit -m "chore: actualizar estadísticas automáticas" || exit 0
          git push
